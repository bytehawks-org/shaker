name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -e SC2034 bin/shaker lib/*.libsh
      - name: tests
        run: ./tests/run.sh
  test-portability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [alpine:3.20, fedora:40, rockylinux:9, opensuse/leap:15.6, archlinux:latest, debian:12]
    container: ${{ matrix.image }}
    steps:
      - name: bootstrap bash and git
        run: |
          if command -v apk >/dev/null; then apk add --no-cache bash git coreutils;
          elif command -v dnf >/dev/null; then dnf install -y git findutils;
          elif command -v zypper >/dev/null; then zypper --non-interactive install git tar gzip findutils;
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git;
          elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y git; fi
      - uses: actions/checkout@v4
      - run: bash ./tests/run.sh
