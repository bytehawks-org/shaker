name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # warnings and errors fail the build; "info" notes (SC1091: not following a sourced file) do not
        run: shellcheck -x --severity=warning -e SC2034 bin/shaker lib/*.libsh
      - name: tests
        run: ./tests/run.sh
  test-portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false              # one distribution failing must not hide the result of the others
      matrix:
        image: [alpine:3.20, fedora:40, rockylinux:9, opensuse/leap:15.6, archlinux:latest, debian:12]
    container: ${{ matrix.image }}
    steps:
      - name: bootstrap bash and git
        run: |
          # bash and git are required; jq / python3+PyYAML (json and yaml configuration) and gpg (signature checks) are the
          # optional tools the tests exercise. BusyBox's own tar, sed and find are left alone on purpose.
          if command -v apk >/dev/null; then apk add --no-cache bash git coreutils jq python3 py3-yaml gnupg;
          elif command -v dnf >/dev/null; then dnf install -y git findutils jq python3 python3-pyyaml gnupg2 tar gzip;
          elif command -v zypper >/dev/null; then zypper --non-interactive install git tar gzip findutils jq python3 python3-PyYAML gpg2;
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git jq python python-yaml gnupg;
          elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y git jq python3 python3-yaml gnupg tar; fi
      - uses: actions/checkout@v4
      - run: bash ./tests/run.sh
